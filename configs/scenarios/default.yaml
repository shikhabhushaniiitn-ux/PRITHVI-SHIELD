project:
  name: PRITHVI-SHIELD
  version: "0.1.0"
  environment: development

application:
  framework: streamlit
  default_language: en

scenario:
  default_region: trishuli_river_corridor
  default_hazard: flood
  event_period:
    start_date: "2026-08-01"
    end_date: "2026-08-31"

data:
  primary_source: sentinel-1-grd
  allow_network_downloads: false
  record_provenance: true
  require_source_metadata: true
  reference_maps_for_validation_only: true

processing:
  save_intermediate_outputs: true

reporting:
  default_language: en
  validate_numeric_claims: true

safety:
  require_human_review: true
  operational_emergency_service: false
